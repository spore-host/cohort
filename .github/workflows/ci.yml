name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not `@v6`: a tag is mutable, and actions/checkout@v6
      # really did move (df4cb1c -> d23441a) with no signal to consumers.
      # Dependabot bumps these pins (.github/dependabot.yml) so they stay current
      # without being mutable; internal/hygiene keeps both true. (#7)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      # REPORTS drift, never fixes it. `gofmt -w` rewrites files and exits 0, so a
      # gate built on it can only ever report success — green on a dirty tree
      # forever, indistinguishable from having no gate at all. Only `gofmt -l`/`-d`
      # can fail. That is why four files sat unformatted on main: nothing checked,
      # and `go vet` does not look at formatting. (#8)
      #
      # gofmt walks paths rather than modules, so `.` covers everything. No vendor/
      # dir here, but the filter matches the rest of the suite's gate.
      - name: Format gate
        run: |
          files=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$files" ]; then
            echo "::error::these files are not gofmt-clean — run 'gofmt -w' on them:"
            echo "$files" | sed 's/^/  /'
            gofmt -d $files
            exit 1
          fi
          echo "✓ gofmt clean"

      # Enforce cohort's import discipline: the core must import no cloud SDK
      # and no scheduler (doc.go, API.md §8 — "not optional"). This is the
      # invariant that lets every consumer trust the SAME unmodified core.
      - name: Guard (no cloud SDK / scheduler imports)
        run: ./scripts/guard-cohort.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The half of pin hygiene that needs the network, so it can't live in the
      # (hermetic, stdlib-only) internal/hygiene package: does each pin's
      # `# vX.Y.Z` actually name the tag its SHA carries? A wrong label is worse
      # than none — it makes a major-version jump read as a routine same-line bump,
      # which is how a checkout v6 -> v7.0.1 bump nearly landed in nf-spawn
      # labelled `# v6`. Read-only (git ls-remote), no auth.
      - name: Verify pin comments match their SHAs
        run: ./scripts/verify-pins.sh

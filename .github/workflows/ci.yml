name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not `@v6`: a tag is mutable, and actions/checkout@v6
      # really did move (df4cb1c -> d23441a) with no signal to consumers.
      # Dependabot bumps these pins (.github/dependabot.yml) so they stay current
      # without being mutable; internal/hygiene keeps both true. (#7)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      # Enforce cohort's import discipline: the core must import no cloud SDK
      # and no scheduler (doc.go, API.md §8 — "not optional"). This is the
      # invariant that lets every consumer trust the SAME unmodified core.
      - name: Guard (no cloud SDK / scheduler imports)
        run: ./scripts/guard-cohort.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
